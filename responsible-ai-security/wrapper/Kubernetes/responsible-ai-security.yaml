apiVersion: apps/v1
kind: Deployment
metadata:
  name: responsible-ai-security-workbench
  namespace: irai-toolkit-test
  labels:
    app: responsible-ai-security-workbench
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: responsible-ai-security-workbench
      version: v1
  template:
    metadata:
      labels:
        app: responsible-ai-security-workbench
        version: v1
    spec:
      automountServiceAccountToken: false  # ✅ Already secure
      imagePullSecrets:
        - name: docker-secret
      containers:
      - name: responsible-ai-security-workbench
        envFrom:
          - configMapRef:
              name: security-workbench-cosmos-config
        image: <Image Name>
        imagePullPolicy: Always
        ports:
          - containerPort: 80
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
              - ALL
          seccompProfile:          
            type: RuntimeDefault  
        resources:
          limits:
            cpu: '5'
            memory: '6Gi'
